<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Pokedex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="device" role="main">

    <div class="device-top">
      <div class="lens" aria-hidden="true">
        <span class="lens-glint"></span>
      </div>
      <div class="indicator-lights" aria-hidden="true">
        <span class="light light-red"></span>
        <span class="light light-yellow"></span>
        <span class="light light-green"></span>
      </div>
      <h1 class="device-title">AI Pokedex</h1>
    </div>

    <div class="screen">
      <div class="screen-inner" id="screen-inner">
        <div class="scanline" aria-hidden="true"></div>

        <form class="lookup-form" id="lookup-form">
          <label class="field-label" for="name-input">Subject name</label>
          <input
            id="name-input"
            type="text"
            placeholder="e.g. Pikachu, or make one up"
            autocomplete="off"
          />

          <label class="field-label" for="persona-select">Dex voice</label>
          <select id="persona-select">
            <option value="a friendly, excited trainer">Excited Trainer</option>
            <option value="a grumpy, no-nonsense scientist">Grumpy Scientist</option>
            <option value="a calm, robotic AI assistant">Robotic AI</option>
            <option value="a sarcastic teenager">Sarcastic Teen</option>
          </select>

          <button type="submit" id="generate-btn">
            <span class="btn-label">Scan</span>
          </button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <section id="card" class="card hidden" aria-live="polite">
          <div class="card-header">
            <span id="card-name" class="card-name"></span>
            <span id="card-number" class="card-number"></span>
          </div>

          <div class="card-types" id="card-types"></div>

          <p id="card-description" class="card-description"></p>

          <div class="stat-block">
            <h2 class="section-label">Stats</h2>
            <div id="card-stats" class="stat-list"></div>
          </div>

          <div class="detail-grid">
            <h2 class="section-label detail-grid-label">Details</h2>
            <dl id="card-details" class="detail-list"></dl>
          </div>

          <div class="tag-row">
            <div class="tag-group">
              <h2 class="section-label">Weak to</h2>
              <p id="card-weaknesses" class="tag-value"></p>
            </div>
            <div class="tag-group">
              <h2 class="section-label">Abilities</h2>
              <p id="card-abilities" class="tag-value"></p>
            </div>
          </div>

          <div class="evolution-row">
            <h2 class="section-label">Evolution line</h2>
            <p id="card-evolutions" class="evolution-value"></p>
          </div>
        </section>
      </div>
    </div>

    <div class="device-bottom" aria-hidden="true">
      <div class="dpad">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="round-buttons">
        <span class="round-btn round-btn-a"></span>
        <span class="round-btn round-btn-b"></span>
      </div>
      <div class="grille">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

  </main>

  <script src="/static/script.js"></script>
</body>
</html>
